apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      role: nfs-server
  template:
    metadata:
      labels:
        role: nfs-server
    spec:
      containers:
      - name: nfs-server
        # Using a modern, actively maintained Alpine-based NFS server
        image: itsthenetwork/nfs-server-alpine:12
        env:
          # Tells the container which folder to expose over NFS
          - name: SHARED_DIRECTORY
            value: "/exports"
        ports:
          - name: nfs
            containerPort: 2049
        securityContext:
          # Required because NFS operates at the Linux kernel level
          privileged: true
        volumeMounts:
          - mountPath: /exports
            name: my-nfs-storage
      volumes:
        - name: my-nfs-storage
          # An empty directory created for practice purposes
          emptyDir: {}